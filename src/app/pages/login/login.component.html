<div class="login-page"><div class="login-card"><div class="brand"><div class="brand-icon">💰</div><h1>MoneyBoard 2.0</h1><p class="subtitle">{{ modalitaRegistrazione() ? 'Crea il tuo account' : 'Accedi al tuo account' }}</p></div>@if (errore()) { <div class="error-banner">{{ errore() }}</div> }<form (ngSubmit)="submit()" #form="ngForm">@if (modalitaRegistrazione()) { <div class="field"><label for="username">Nome utente</label><input id="username" name="username" type="text" [(ngModel)]="username" placeholder="Il tuo username" autocomplete="username" required /></div> }<div class="field"><label for="email">Email</label><input id="email" name="email" type="email" [(ngModel)]="email" placeholder="nome@esempio.com" autocomplete="email" required /></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" [(ngModel)]="password" placeholder="••••••••" autocomplete="current-password" required /></div><button type="submit" class="btn btn-primary btn-block btn-lg" [disabled]="caricamento()">@if (caricamento()) { <span class="spinner"></span> } {{ modalitaRegistrazione() ? 'Registrati' : 'Accedi' }}</button></form><button type="button" class="btn btn-neutral btn-block" (click)="cambiaModalita()" [disabled]="caricamento()">{{ modalitaRegistrazione() ? 'Hai già un account? Accedi' : 'Non hai un account? Registrati' }}</button></div></div>
