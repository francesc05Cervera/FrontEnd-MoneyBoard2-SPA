<div class="crea-page"><button type="button" class="btn-back" (click)="annulla()">&larr; Torna alla sezione</button><div class="card form-card"><h1>Nuova transazione</h1><p class="sottotitolo">Compila i campi per aggiungere una transazione a questa sezione.</p>@if (errore()) { <div class="error-banner">{{ errore() }}</div> }<form (ngSubmit)="creaTransazione()" #form="ngForm"><div class="field"><label for="titolo">Titolo</label><input id="titolo" name="titolo" type="text" [(ngModel)]="titolo" placeholder="Es. Stipendio, Spesa, ecc." required /></div><div class="field"><label for="descrizione">Descrizione (opzionale)</label><textarea id="descrizione" name="descrizione" rows="3" [(ngModel)]="descrizione" placeholder="Dettagli aggiuntivi..."></textarea></div><div class="field"><label for="importo">Importo (€)</label><input id="importo" name="importo" type="number" step="0.01" min="0.01" [(ngModel)]="importo" placeholder="Es. 50.00" required /></div><div class="field"><label>Tipologia</label><div class="toggle-container"><button type="button" class="toggle-btn" [class.active]="entrata" (click)="entrata = true"><span class="toggle-icon">⬇️</span> Entrata</button><button type="button" class="toggle-btn" [class.active]="!entrata" (click)="entrata = false"><span class="toggle-icon">⬆️</span> Uscita</button></div></div><div class="field"><label>Data</label><input type="text" [value]="dataOdierna" disabled class="data-readonly" /><div class="hint">La data è impostata automaticamente a oggi.</div></div><div class="azioni-form"><button type="button" class="btn btn-neutral" (click)="annulla()">Annulla</button><button type="submit" class="btn btn-primary" [disabled]="creazioneInCorso()">@if (creazioneInCorso()) { <span class="spinner"></span> } Salva transazione</button></div></form></div></div>
